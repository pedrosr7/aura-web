<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aura</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="color-scheme" content="dark" />
  <!-- The query holds the athlete's answers: nothing but the origin leaves with a request to the font service. -->
  <meta name="referrer" content="strict-origin" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #0E0E0E;
      --surface: #161616;
      --border: #2A2A2A;
      --neon: #CCFF00;
      --fg: #ECECEC;
      --muted: #8A8A8A;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 24px;
    }
    .card { width: 100%; max-width: 420px; text-align: center; }
    .logo { width: 64px; height: 64px; border-radius: 16px; margin: 0 auto 24px; display: block; }
    .label {
      font-family: 'JetBrains Mono', monospace;
      text-transform: uppercase;
      letter-spacing: .22em;
      font-weight: 600;
      font-size: 11px;
      color: var(--neon);
      margin-bottom: 14px;
    }
    h1 { font-size: 26px; font-weight: 700; line-height: 1.2; margin-bottom: 12px; }
    p.sub { color: var(--muted); font-size: 15px; line-height: 1.55; margin-bottom: 28px; }
    .stores { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
    a.btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      height: 52px; border-radius: 14px; text-decoration: none;
      font-weight: 600; font-size: 15px; transition: transform .2s, box-shadow .25s, background .2s, border-color .2s;
    }
    a.btn-primary { background: var(--neon); color: var(--bg); }
    a.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 40px -8px rgba(204,255,0,.45); }
    a.btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--fg); }
    a.btn-ghost:hover { border-color: #4a4a4a; background: var(--surface); transform: translateY(-2px); }
    .installed {
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
      padding: 16px; display: flex; flex-direction: column; gap: 12px;
    }
    .installed .hint { font-size: 13px; color: var(--muted); }
    .qr {
      width: 100%; max-width: 280px; margin: 0 auto 8px; padding: 14px;
      background: #fff; border-radius: 16px;
    }
    .qr svg { display: block; width: 100%; height: auto; }
    .foot { margin-top: 30px; font-size: 12px; color: var(--muted); }
    .foot a { color: var(--muted); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/assets/aura_icon.png" alt="Aura" />
    <div class="label" data-i18n="label">Prepárala con Aura</div>

    <section id="stores" hidden>
      <h1 data-i18n="titleStores"></h1>
      <p class="sub" data-i18n="subStores"></p>
      <div class="stores">
        <a class="btn btn-primary" id="store-first" href="#"></a>
        <a class="btn btn-ghost" id="store-second" href="#"></a>
      </div>
      <div class="installed" id="reopen-box">
        <span class="hint" data-i18n="installedHint"></span>
        <a class="btn btn-ghost" id="reopen" href="#" data-i18n="reopen"></a>
      </div>
    </section>

    <section id="qr" hidden>
      <h1 data-i18n="titleQr"></h1>
      <p class="sub" data-i18n="subQr"></p>
      <div class="qr" id="qr-code"></div>
    </section>

    <noscript>
      <div class="stores">
        <a class="btn btn-primary" href="https://apps.apple.com/us/app/aura-ai-training-coach/id6773849897">App Store</a>
        <a class="btn btn-ghost" href="https://play.google.com/store/apps/details?id=com.pampa.aura">Google Play</a>
      </div>
    </noscript>

    <div class="foot"><a href="/">aura.pampaiter.com</a></div>
  </main>

  <script src="/assets/js/qrcode.js"></script>
  <script src="/assets/js/plan-bridge.js"></script>
  <script>
    PlanBridge.render(document, {
      search: location.search,
      userAgent: navigator.userAgent,
      maxTouchPoints: navigator.maxTouchPoints,
      language: navigator.language,
    });
  </script>
</body>
</html>
